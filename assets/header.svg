<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <style>
    .bg { fill: #020c1b; }
    .hi { font: 16px 'Courier New', monospace; fill: #64ffda; letter-spacing: 1px; }
    .name { font: 52px Marcellus, Georgia, 'Times New Roman', serif; fill: #e6ecff; }
    .sub { font: 22px Marcellus, Georgia, serif; fill: #8892b0; }
    .tag { font: 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8892b0; }
    .hl { fill: #ca66ff; }
    .fade { opacity: 0; animation: up 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    .line { stroke: #64ffda; stroke-width: 1; opacity: 0.35; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.4s 0.9s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect class="bg" width="900" height="260" rx="14"/>
  <rect width="899" height="259" x="0.5" y="0.5" rx="14" fill="none" stroke="#64ffda" stroke-opacity="0.2"/>
  <text class="hi fade d1" x="60" y="72">Hi, I am</text>
  <text class="name fade d2" x="56" y="132">Rishav Bairagya</text>
  <text class="sub fade d3" x="60" y="172">I build <tspan class="hl">AI agents</tspan>, automation and products that ship.</text>
  <line class="line" x1="60" y1="198" x2="320" y2="198"/>
  <text class="tag fade d4" x="60" y="226">Founders' Associate @ Curvo  ·  CSE @ Narula Institute of Technology  ·  Data Science @ IIT Madras</text>
</svg>
